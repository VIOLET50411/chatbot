name: soul-mate-vps

services:
  core:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ${SOUL_MATE_VPS_ENV_FILE:-.env.vps}
    environment:
      DATA_DIR: /app/data
      CHARACTER_REGISTRY_DIR: /app/data/registry
      HF_HOME: /app/data/models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/data/models/sentence-transformers
      SOUL_MATE_BIND_ADDRESS: 0.0.0.0
      PYTHONUTF8: "1"
    volumes:
      - type: bind
        source: ../../data
        target: /app/data
    expose:
      - "8080"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); assert r.status == 200 and json.load(r).get('status') == 'ok'"
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    env_file:
      - ${SOUL_MATE_VPS_ENV_FILE:-.env.vps}
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
